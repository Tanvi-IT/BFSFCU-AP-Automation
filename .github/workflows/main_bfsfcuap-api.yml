# Docs: https://github.com/Azure/functions-action
name: Build and deploy Node.js project to Azure Function App - bfsfcuap-api

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/main_bfsfcuap-api.yml'
  workflow_dispatch:

env:
  # The Functions app lives in the api/ subfolder of this monorepo — NOT the
  # repo root (the default the portal template assumed, which built nothing and
  # zipped the whole repo).
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'api'
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install & build (api)
        shell: bash
        run: |
          pushd '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          npm ci
          npm run build
          popd

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'bfsfcuap-api'
          slot-name: 'Production'
          # Deploy the built api/ folder (host.json + package.json main
          # dist/src/index.js + dist + node_modules at its root).
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_09FF5AF28B814961B7EBD7C3A30889EA }}
          sku: 'flexconsumption'
